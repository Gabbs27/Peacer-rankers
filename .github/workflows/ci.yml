name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm install`, not `npm ci`: the lockfile is generated on macOS and omits
        # linux-only optional entries, so npm on the runner rebuilds a different
        # ideal tree and `npm ci` fails its sync check. The checks below are what
        # this workflow actually guards; exact dependency pinning is Vercel's job.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build must not require a live key; a dummy keeps env-reads happy.
          RIOT_API_KEY: ci-dummy-key
